# Exemplo sem segredos. Copie para a raiz do canal, fora do git.
# Apague o bot que este projeto não usa. A chave mora no arquivo `env` (chmod 600), nunca aqui.
# Sem `teto_diario` o aviso não dispara: teto ausente não vira ilimitado.

projeto: exemplo
teto_diario: 40
agrupar_segundos: 60

bots:
  marketing:
    env: ~/.canal/segredos/marketing.env
    tipos: [qa, duvida]
    para_que: QA de vídeo e roteiro
    proibido:
      - escrever fora de respostas/
      - escrever em pedidos/
      - chamar o webhook
      - copiar chave, URL de webhook, senha ou segredo para resposta, log ou issue
      - usar serviço pago ou gastar sem aprovação do dono
      - inventar dado, número ou depoimento
  infraestrutura:
    env: ~/.canal/segredos/infraestrutura.env
    tipos: [duvida]
    para_que: revisar deploy e DNS
    proibido:
      - escrever fora de respostas/
      - chamar o webhook
      - copiar chave, URL de webhook, senha ou segredo para resposta, log ou issue
      - mudar produção sem aprovação do dono
